<meta name="apple-mobile-web-app-title" content="Instalador">
<meta name="application-name" content="Instalador">
<meta name="color-scheme" content="dark">
<title>Instaladores · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F6F5F2; --hoja:#FFFFFF; --hoja-2:#EFEDE8; --linea:#DAD6CF; --tinta:#16120F; --suave:#5F5A54; --acento:#D52B18; --sobre-acento:#FFFFFF;
  --ok:#1F8A4C; --ok-fondo:#E3F3E9; --aviso:#B7791F; --aviso-fondo:#FBF1DE; --mal:#C81E3A; --mal-fondo:#FBE5E9; --sombra:0 10px 26px rgba(22,18,15,.10);
  --ease:cubic-bezier(.32,.72,0,1); --resorte:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --fondo:#050507; --hoja:#141112; --hoja-2:#362E2D; --linea:#2E2726; --tinta:#F2F1EC; --suave:#AAACA1; --acento:#E3311D; --sobre-acento:#FFFFFF;
  --ok:#5FC48A; --ok-fondo:#12241A; --aviso:#F2B33D; --aviso-fondo:#2A2210; --mal:#FF5470; --mal-fondo:#33131B; --sombra:0 12px 30px rgba(0,0,0,.45); } }
:root[data-theme="dark"]{
  --fondo:#050507; --hoja:#141112; --hoja-2:#362E2D; --linea:#2E2726; --tinta:#F2F1EC; --suave:#AAACA1; --acento:#E3311D; --sobre-acento:#FFFFFF;
  --ok:#5FC48A; --ok-fondo:#12241A; --aviso:#F2B33D; --aviso-fondo:#2A2210; --mal:#FF5470; --mal-fondo:#33131B; --sombra:0 12px 30px rgba(0,0,0,.45); }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; }
body{ background:var(--fondo); color:var(--tinta); font-family:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size:17px; line-height:1.4; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
.num{ font-family:'Barlow Condensed', 'Barlow', system-ui, sans-serif; font-weight:700; letter-spacing:-.01em; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:3px solid var(--acento); outline-offset:2px; }
.app{ max-width:520px; margin:0 auto; padding:0 16px 150px; }
/* Encabezado */
.top{ display:flex; align-items:center; gap:12px; padding:14px 0 10px; }
.top .quien{ flex:1; min-width:0; }
.top .hola{ font-size:15px; color:var(--suave); }
.top .nombre{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:30px; line-height:1.05; }
.top .obra{ font-size:14px; color:var(--suave); margin-top:2px; }
.logo{ width:104px; flex:none; background:#fff; border-radius:9px; padding:4px 6px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
.logo img{ display:block; width:100%; height:auto; aspect-ratio:960/403; }
/* Bloques */
.bloque{ background:var(--hoja); border:1px solid var(--linea); border-radius:20px; padding:16px; margin-top:14px; box-shadow:var(--sombra); }
.bloque h2{ margin:0 0 10px; font-size:19px; font-weight:700; display:flex; align-items:center; gap:8px; }
.bloque h2 .extra{ margin-left:auto; font-size:14px; font-weight:500; color:var(--suave); white-space:nowrap; }
.muted{ color:var(--suave); font-size:15px; }
/* Botón losa (asistencia) */
.losa{ width:100%; display:flex; align-items:center; gap:14px; padding:18px 18px; border-radius:18px; text-align:left; transition:transform .3s var(--resorte), filter .12s; }
.losa:active{ transform:scale(.97); filter:brightness(.92); transition-duration:.08s; }
.losa .icono{ width:54px; height:54px; border-radius:50%; display:grid; place-items:center; font-size:26px; flex:none; background:rgba(255,255,255,.18); }
.losa .t1{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:26px; line-height:1; }
.losa .t2{ font-size:14px; opacity:.88; margin-top:3px; }
.losa.entrada{ background:var(--ok); color:#fff; }
.losa.salida{ background:var(--hoja-2); color:var(--tinta); border:1px solid var(--linea); }
.losa.salida .icono{ background:var(--mal-fondo); color:var(--mal); }
.reloj{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; margin:2px 0 12px; }
.reloj .num{ white-space:nowrap; }
.reloj .num{ font-size:44px; line-height:1; }
.gps{ display:inline-flex; align-items:center; gap:6px; font-size:14px; padding:5px 10px; border-radius:999px; background:var(--ok-fondo); color:var(--ok); font-weight:600; }
/* Tarea */
.tarea{ border:1px solid var(--linea); border-radius:16px; padding:14px; margin-top:10px; }
.tarea .titulo{ display:flex; align-items:baseline; gap:10px; }
.tarea .cant{ font-size:40px; line-height:.95; }
.tarea .que{ font-weight:700; font-size:18px; }
.tarea .donde{ color:var(--suave); font-size:15px; margin-top:2px; }
.barra{ height:12px; border-radius:999px; background:var(--hoja-2); overflow:hidden; margin:12px 0 6px; }
.barra > i{ display:block; height:100%; border-radius:999px; background:var(--ok); width:0; transition:width .6s var(--ease); }
.estado{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; padding:4px 10px; border-radius:999px; }
.estado.pend{ background:var(--aviso-fondo); color:var(--aviso); }
.estado.ok{ background:var(--ok-fondo); color:var(--ok); }
.btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; min-height:56px; padding:14px; border-radius:16px; font-weight:700; font-size:18px; margin-top:12px; transition:transform .3s var(--resorte), filter .12s; }
.btn:active{ transform:scale(.97); filter:brightness(.92); transition-duration:.08s; }
.btn.prim{ background:var(--acento); color:var(--sobre-acento); box-shadow:0 8px 20px rgba(213,43,24,.28); }
.btn.sec{ background:var(--hoja-2); color:var(--tinta); border:1px solid var(--linea); }
.btn:disabled{ opacity:.45; pointer-events:none; }
.par{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.par .btn{ margin-top:0; min-height:64px; flex-direction:column; gap:2px; font-size:16px; }
.par .btn span{ font-size:24px; }
/* Avisos del jefe */
.aviso-jefe{ display:flex; gap:10px; padding:12px; border-radius:14px; background:var(--hoja-2); margin-top:8px; font-size:15px; }
.aviso-jefe b{ display:block; font-size:13px; color:var(--suave); font-weight:600; }
/* Lista de envíos */
.envio{ display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--linea); font-size:15px; }
.envio:first-child{ border-top:0; }
.envio .ico{ font-size:20px; line-height:1.2; }
.envio .meta{ font-size:13px; color:var(--suave); }
/* Hoja (formularios) */
.velo{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; transition:opacity .25s; }
.velo.ver{ opacity:1; }
.hoja{ position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:520px; margin:0 auto; background:var(--hoja); border-radius:24px 24px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow:auto; transform:translateY(105%); transition:transform .45s cubic-bezier(.34,1.2,.64,1); box-shadow:0 -14px 40px rgba(0,0,0,.35); }
.hoja.ver{ transform:none; }
.hoja .asa{ width:42px; height:5px; border-radius:3px; background:var(--linea); margin:0 auto 12px; }
.hoja h3{ margin:0 0 4px; font-size:22px; font-family:'Barlow Condensed',sans-serif; font-weight:800; }
/* Puertas para tocar */
.puertas{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0 6px; }
.puerta{ aspect-ratio:3/4; border-radius:12px; border:2px dashed var(--linea); background:var(--hoja-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-weight:700; font-size:14px; transition:transform .3s var(--resorte), background .2s, border-color .2s; }
.puerta .marco{ width:38%; height:44%; border:3px solid currentColor; border-bottom:0; border-radius:4px 4px 0 0; opacity:.55; }
.puerta.lista{ background:var(--ok); color:#fff; border:2px solid var(--ok); }
.puerta.lista .marco{ opacity:1; }
.puerta.ya{ opacity:.45; pointer-events:none; }
.puerta:active{ transform:scale(.92); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.chip{ padding:10px 14px; border-radius:999px; border:1px solid var(--linea); background:var(--hoja-2); font-size:15px; font-weight:600; }
.chip.on{ background:var(--acento); color:var(--sobre-acento); border-color:var(--acento); }
textarea{ width:100%; min-height:84px; border-radius:14px; border:1px solid var(--linea); background:var(--fondo); color:var(--tinta); padding:12px; font:inherit; font-size:16px; resize:vertical; }
.foto{ display:flex; align-items:center; gap:12px; padding:12px; border-radius:14px; border:1px dashed var(--linea); margin-top:10px; font-weight:600; cursor:pointer; }
.foto img{ width:56px; height:56px; border-radius:10px; object-fit:cover; }
/* Barra inferior */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--hoja) 92%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--linea); padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; }
.tabs .in{ max-width:520px; width:100%; display:grid; grid-template-columns:repeat(3,1fr); }
.tab{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; font-size:13px; font-weight:600; color:var(--suave); border-radius:12px; }
.tab span{ font-size:22px; }
.tab.on{ color:var(--acento); background:color-mix(in srgb, var(--acento) 10%, transparent); }
/* Vista del jefe */
.ojo{ position:fixed; right:14px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:31; padding:11px 14px; border-radius:999px; background:var(--tinta); color:var(--fondo); font-weight:700; font-size:14px; box-shadow:0 10px 24px rgba(0,0,0,.35); }
.ojo .pt{ display:inline-block; min-width:20px; height:20px; border-radius:10px; background:var(--acento); color:#fff; font-size:12px; line-height:20px; text-align:center; margin-left:6px; padding:0 5px; }
.feed{ margin-top:10px; }
.feed .ev{ display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--linea); font-size:15px; animation: entra .45s var(--resorte); }
.feed .ev:first-child{ border-top:0; }
@keyframes entra{ from{ opacity:0; transform:translateY(-8px); } }
.mini{ display:inline-flex; padding:7px 12px; border-radius:10px; font-size:14px; font-weight:700; background:var(--ok); color:#fff; margin-top:6px; }
/* Ingreso */
.ingreso{ min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; padding:20px 4px 22px; position:relative; }
.ingreso::before{ content:''; position:fixed; inset:0 0 auto 0; height:55vh; pointer-events:none; z-index:-1;
  background:radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--acento) 16%, transparent) 0%, transparent 70%); }
.ingreso .arriba{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; text-align:center; padding-bottom:clamp(24px, 6dvh, 56px); }
.ingreso .logo{ width:min(44vw, 168px); margin:0 0 22px; border-radius:10px; padding:5px 7px; }
.ingreso h1{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; letter-spacing:.01em; margin:0; }
.ingreso p{ color:var(--suave); margin:4px 0 0; font-size:15px; }
.pin{ display:flex; justify-content:center; gap:16px; margin:20px 0 0; }
.pin i{ width:13px; height:13px; border-radius:50%; border:1.5px solid var(--suave); transition:background .2s, border-color .2s, transform .3s var(--resorte), box-shadow .2s; }
.pin i.on{ background:var(--acento); border-color:var(--acento); transform:scale(1.15); box-shadow:0 0 10px color-mix(in srgb, var(--acento) 60%, transparent); }
.teclado{ display:grid; grid-template-columns:repeat(3, auto); justify-content:center; column-gap:clamp(20px, 7vw, 30px); row-gap:clamp(12px, 2.2dvh, 18px); margin:0 auto; }
.tecla{ width:clamp(66px, 19vw, 78px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  background:color-mix(in srgb, var(--tinta) 5%, transparent); border:1.5px solid color-mix(in srgb, var(--acento) 70%, transparent);
  color:var(--tinta); font-family:'Barlow', system-ui, sans-serif; font-size:30px; font-weight:500; line-height:1;
  transition:transform .25s var(--resorte), background .15s, color .15s, border-color .15s; }
.tecla:active{ transform:scale(.92); background:var(--acento); border-color:var(--acento); color:#fff; transition-duration:.06s; }
.tecla.borrar{ background:transparent; border-color:transparent; color:var(--suave); }
.tecla.borrar:active{ background:color-mix(in srgb, var(--tinta) 8%, transparent); color:var(--tinta); }
.tecla svg{ width:28px; height:28px; }
.demo-nota{ font-size:13px; color:var(--suave); text-align:center; margin-top:18px; }
.sacudir{ animation: sacudir .4s; }
@keyframes sacudir{ 20%{transform:translateX(-10px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(3px);} }
.toast{ position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 12px); margin:0 auto; width:max-content; max-width:88%; z-index:60; padding:11px 18px; border-radius:999px; background:var(--tinta); color:var(--fondo); font-weight:600; font-size:15px; box-shadow:0 10px 26px rgba(0,0,0,.35); animation: baja .45s var(--resorte); }
@keyframes baja{ from{ opacity:0; transform:translateY(-16px) scale(.94); } }
.semana{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; align-items:end; height:140px; margin-top:6px; }
.semana .d{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; color:var(--suave); }
.semana .col{ width:100%; border-radius:8px 8px 4px 4px; background:var(--hoja-2); position:relative; }
.semana .col.hoy{ background:var(--acento); }
.cifras{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
.cifras div{ background:var(--hoja-2); border-radius:14px; padding:12px 8px; text-align:center; }
.cifras .num{ font-size:30px; line-height:1; display:block; }
.cifras small{ color:var(--suave); font-size:13px; }
.demo-nota{ font-size:13px; color:var(--suave); text-align:center; margin-top:22px; }

/* Losas de asistencia con íconos propios */
.losa{ min-height:96px; padding:20px; }
.losa .icono{ width:58px; height:58px; }
.losa .icono svg{ width:30px; height:30px; }
.losa .t1{ font-size:28px; }
/* Elementos para tocar (puertas, closets, muebles) */
.elems{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0 6px; }
.elem{ min-height:96px; border-radius:16px; border:2px solid var(--linea); background:var(--hoja-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:10px 6px; position:relative; transition:transform .3s var(--resorte), background .2s, border-color .2s; }
.elem svg{ width:30px; height:30px; opacity:.7; }
.elem .cod{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; letter-spacing:.01em; }
.elem .check{ position:absolute; top:6px; right:8px; font-size:15px; font-weight:800; opacity:0; transition:opacity .2s; }
.elem.lista{ background:var(--ok); border-color:var(--ok); color:#fff; }
.elem.lista svg{ opacity:1; }
.elem.lista .check{ opacity:1; }
.elem.ya{ opacity:.45; pointer-events:none; }
.elem:active{ transform:scale(.94); }
/* Contador grande (sin códigos) */
.contador{ display:grid; grid-template-columns:76px 1fr 76px; align-items:center; gap:10px; margin:16px 0 8px; }
.contador button{ height:76px; border-radius:20px; background:var(--hoja-2); border:1px solid var(--linea); font-size:38px; font-weight:700; transition:transform .25s var(--resorte); }
.contador button:active{ transform:scale(.9); }
.contador .valor{ text-align:center; }
.contador .valor .num{ font-size:64px; line-height:1; display:block; }
.contador .valor small{ color:var(--suave); font-size:14px; }
.tarea .ico-tipo{ width:44px; height:44px; border-radius:12px; background:var(--hoja-2); display:grid; place-items:center; flex:none; }
.tarea .ico-tipo svg{ width:26px; height:26px; }
.otro{ display:none; margin-top:4px; }
.otro.ver{ display:block; }
input.txt{ width:100%; min-height:52px; border-radius:14px; border:1px solid var(--linea); background:var(--fondo); color:var(--tinta); padding:12px; font:inherit; font-size:16px; }
.nota-op{ font-size:13px; color:var(--suave); margin:-2px 0 6px; }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
:root{ color-scheme:dark; }
</style>

  problema:['Falta material','Elemento dañado','Medida no cuadra','No hay acceso','Falta herramienta'],
  bitacora:['Llegó material','Cambio de piso','Visita del cliente','Se fue la luz']
};
const S = { pin:'', usuario:null, entrada:null, salida:null, envios:[], feed:[], sinLeer:0, tab:'hoy',
  prog: Object.fromEntries(TAREAS.map(t=>[t.id,{listas:[], aprobadas:[], nPend:0, nOk:0, desvios:[]}])),
  rep:null, notaChip:null, foto:null, tipoNota:'bitacora', desv:{} };
const DEMO = {codigo:'1234', nombre:'Andrés Guamán', grupo:'Grupo 2', obra:'MAXXIMUS · Guayaquil', jefe:'Isaac Zamora'};
const $ = s=> document.querySelector(s);
const esc = s=> String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl = (n,u)=> n===1? u : (/[aeiou]$/i.test(u)? u+'s' : (/[lrndj]$/i.test(u)? u+'es' : u+'s'));
function toast(m){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2300); }
function alJefe(ico, txt, accion){ S.feed.unshift({ico, txt, hora:fmtH(new Date()), accion}); S.sinLeer++; pintarOjo(); if($('#jefeBox')) pintarJefe(); }
const hechasDe = t=>{ const p = S.prog[t.id]; return t.codigos? p.listas.length+p.aprobadas.length : p.nPend+p.nOk; };

/* ---------- Ingreso ---------- */
function ingreso(){
  const borrar = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>';
  $('#raiz').innerHTML = '<div class="app" style="padding-bottom:0;"><div class="ingreso">'+
    '<div class="arriba"><div class="logo"><img src="'+LOGO+'" alt="Colineal · CTIN"></div>'+
    '<h1>Instaladores</h1><p>Escribe tu código de 4 números</p>'+
    '<div class="pin" id="pin">'+[0,1,2,3].map(i=>'<i class="'+(S.pin.length>i?'on':'')+'"></i>').join('')+'</div></div>'+
    '<div class="teclado">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=> k===''? '<span></span>' : '<button class="tecla'+(k==='⌫'?' borrar':'')+'" onclick="tecla(\''+k+'\')" aria-label="'+(k==='⌫'?'Borrar':k)+'">'+(k==='⌫'? borrar : k)+'</button>').join('')+'</div>'+
    '<p class="demo-nota">Demo: tu código es <b>1234</b></p></div></div>';
}
function tecla(k){
  if(k==='⌫') S.pin = S.pin.slice(0,-1); else if(S.pin.length<4) S.pin += k;
  ingreso();
  if(S.pin.length===4){
    if(S.pin===DEMO.codigo){ S.usuario = DEMO; setTimeout(()=>{ alJefe('🔑','<b>Andrés Guamán</b> abrió la app'); app(); }, 180); }
    else { $('#pin').classList.add('sacudir'); toast('Código incorrecto. Prueba de nuevo.'); setTimeout(()=>{ S.pin=''; ingreso(); }, 450); }
  }
}

/* ---------- App ---------- */
function app(){
  const tabs = '<nav class="tabs" aria-label="Secciones"><div class="in">'+
    [['hoy','🏗️','Hoy'],['anotar','📝','Anotar'],['semana','📅','Mi semana']].map(([k,i,l])=>'<button class="tab '+(S.tab===k?'on':'')+'" onclick="irTab(\''+k+'\')"><span>'+i+'</span>'+l+'</button>').join('')+'</div></nav>';
  const cuerpo = S.tab==='hoy'? vistaHoy() : (S.tab==='anotar'? vistaAnotar() : vistaSemana());
  $('#raiz').innerHTML = '<div class="app">'+
    '<header class="top"><div class="quien"><div class="hola">'+saludo()+'</div><div class="nombre">'+esc(S.usuario.nombre.split(' ')[0])+'</div><div class="obra">'+esc(S.usuario.grupo)+' · '+esc(S.usuario.obra)+'</div></div>'+
    '<div class="logo"><img src="'+LOGO+'" alt="Colineal · CTIN"></div></header>'+cuerpo+'</div>'+tabs+
    '<button class="ojo" onclick="abrirJefe()">👁 Así lo ve el jefe'+(S.sinLeer? '<span class="pt">'+S.sinLeer+'</span>':'')+'</button>';

}
function pintarOjo(){ const o = $('.ojo'); if(o) o.innerHTML = '👁 Así lo ve el jefe'+(S.sinLeer? '<span class="pt">'+S.sinLeer+'</span>':''); }
function saludo(){ const h = new Date().getHours(); return h<12? 'Buenos días,' : (h<19? 'Buenas tardes,' : 'Buenas noches,'); }
function irTab(k){ S.tab = k; app(); window.scrollTo(0,0); }

function tarjetaTarea(t){
  const p = S.prog[t.id], h = hechasDe(t), pend = t.codigos? p.listas.length : p.nPend, ok = t.codigos? p.aprobadas.length : p.nOk;
  const estado = pend? '<span class="estado pend">⏳ '+pend+' enviada'+(pend>1?'s':'')+' · el jefe revisa</span>' : (ok? '<span class="estado ok">✓ '+ok+' aprobada'+(ok>1?'s':'')+'</span>' : '');
  return '<div class="tarea"><div class="titulo" style="align-items:center;"><span class="ico-tipo">'+IC[t.tipo]+'</span><div style="flex:1; min-width:0;"><div class="que">'+esc(t.trabajo)+'</div><div class="donde">'+esc(t.donde)+(t.codigos? ' · '+esc(t.codigos[0])+' a '+esc(t.codigos[t.codigos.length-1]) : '')+'</div></div><span class="num cant">'+t.cant+'</span></div>'+
    '<div class="barra"><i data-w="'+(h/t.cant*100)+'"></i></div>'+
    '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;"><span class="muted"><b style="color:var(--tinta);">'+h+' de '+t.cant+'</b> '+pl(t.cant, t.unidad)+'</span>'+estado+'</div>'+
    (p.desvios.length? '<div style="margin-top:10px;">'+p.desvios.map(d=>'<div class="aviso-jefe" style="margin-top:6px; font-size:14px;"><span>⏸</span><div style="flex:1;"><b>'+esc(d.tiempo)+' en otra tarea</b>'+esc(d.que)+(d.quien? ' · lo pidió '+esc(d.quien).toLowerCase() : '')+'<div style="margin-top:4px;">'+(d.estado==='ok'? '<span class="estado ok">✓ Aceptado: no cuenta en tu contra</span>' : (d.estado==='no'? '<span class="estado" style="background:var(--mal-fondo); color:var(--mal);">No aplica</span>' : '<span class="estado pend">⏳ El jefe lo revisa</span>'))+'</div></div></div>').join('')+'</div>' : '')+
    (h<t.cant? '<button class="btn prim" onclick="abrirReporte(\''+t.id+'\')" '+(!S.entrada?'disabled':'')+'>✅ Reportar lo que hice</button>'+
      '<button class="btn sec" style="min-height:48px; font-size:16px; margin-top:8px;" onclick="abrirDesvio(\''+t.id+'\')" '+(!S.entrada?'disabled':'')+'>⏸ Me sacaron de esta tarea</button>' : '<div class="estado ok" style="margin-top:10px;">✓ Terminado</div>')+
  '</div>';
}
function vistaHoy(){
  let asis;
  if(!S.entrada) asis = '<button class="losa entrada" onclick="marcarEntrada()"><span class="icono">'+IC.entrada+'</span><span><div class="t1">Marcar entrada</div><div class="t2">Toca al llegar a la obra</div></span></button>';
  else if(!S.salida) asis = '<div class="reloj"><span class="num" id="cron">'+cron()+'</span><span class="muted">en obra desde '+fmtH(S.entrada)+'</span></div><span class="gps">📍 Estás en la obra</span>'+
      '<button class="losa salida" style="margin-top:12px;" onclick="marcarSalida()"><span class="icono">'+IC.salida+'</span><span><div class="t1">Marcar salida</div><div class="t2">Toca al terminar tu jornada</div></span></button>';
  else asis = '<div class="reloj"><span class="num">'+durTxt(S.salida-S.entrada)+'</span><span class="muted">trabajadas hoy · '+fmtH(S.entrada)+' a '+fmtH(S.salida)+'</span></div><span class="estado ok">✓ Jornada registrada</span>';
  return '<section class="bloque" aria-label="Asistencia"><h2>👷 Asistencia</h2>'+asis+'</section>'+
    '<section class="bloque"><h2>📋 Mi trabajo de hoy <span class="extra">'+TAREAS.length+' tareas</span></h2>'+(!S.entrada? '<div class="muted" style="margin-bottom:4px;">Marca tu entrada para poder reportar.</div>':'')+TAREAS.map(tarjetaTarea).join('')+'</section>'+
    '<section class="bloque"><h2>📣 Avisos de tu jefe</h2><div class="aviso-jefe"><span>💬</span><div><b>Isaac · 06:45</b>Hoy prioridad piso 3. El transporte con marcos llega a las 10:00.</div></div></section>';
}
function cron(){ return durTxt(Date.now()-S.entrada.getTime()); }
function durTxt(ms){ const m = Math.max(Math.floor(ms/60000),0); return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; }
setInterval(()=>{ const c = $('#cron'); if(c && S.entrada && !S.salida) c.textContent = cron(); }, 15000);
function marcarEntrada(){ S.entrada = new Date(); toast('Entrada marcada · '+fmtH(S.entrada)); alJefe('🟢','<b>Andrés Guamán</b> marcó entrada a las '+fmtH(S.entrada)+' · 📍 en la obra'); app(); }
function marcarSalida(){ S.salida = new Date(); toast('Salida marcada · '+durTxt(S.salida-S.entrada)+' trabajadas'); alJefe('🔴','<b>Andrés Guamán</b> marcó salida · '+durTxt(S.salida-S.entrada)+' trabajadas'); app(); }

/* ---------- Hojas ---------- */
function abrirHoja(html, id){
  cerrarHoja(true);
  const v = document.createElement('div'); v.className='velo'; v.onclick = ()=>cerrarHoja();
  const h = document.createElement('div'); h.className='hoja'; h.id = id||'hoja'; h.setAttribute('role','dialog'); h.innerHTML = '<div class="asa"></div>'+html;
  document.body.append(v,h); requestAnimationFrame(()=>{ v.classList.add('ver'); h.classList.add('ver'); });
}
function cerrarHoja(rapido){ document.querySelectorAll('.velo,.hoja').forEach(el=>{ if(rapido){ el.remove(); return; } el.classList.remove('ver'); setTimeout(()=>el.remove(), 380); }); }
function chipsHtml(lista){
  return '<div class="chips">'+lista.map(c=>'<button class="chip" onclick="chip(this)">'+esc(c)+'</button>').join('')+'<button class="chip" onclick="chipOtro(this)">✏️ Otra…</button></div>'+
    '<div class="otro" id="otroBox"><input class="txt" id="otroTxt" placeholder="Escribe lo que pasó"></div>'+
    '<div class="nota-op">Estas opciones las define tu jefe para cada trabajo.</div>';
}
function chip(b){ document.querySelectorAll('.chips .chip').forEach(c=>c.classList.remove('on')); b.classList.add('on'); S.notaChip = b.textContent; $('#otroBox').classList.remove('ver'); }
function chipOtro(b){ document.querySelectorAll('.chips .chip').forEach(c=>c.classList.remove('on')); b.classList.add('on'); S.notaChip = null; $('#otroBox').classList.add('ver'); setTimeout(()=>$('#otroTxt').focus(), 50); }
function notaElegida(){ const o = $('#otroTxt'); return (o && $('#otroBox').classList.contains('ver') && o.value.trim()) || S.notaChip || ''; }
function foto(inp){ const f = inp.files && inp.files[0]; if(!f) return; const r = new FileReader(); r.onload = e=>{ S.foto = e.target.result; const box = $('#fotoBox'); if(box) box.innerHTML = '<img src="'+S.foto+'" alt=""> Foto lista · tocar para cambiar'; }; r.readAsDataURL(f); }
const fotoHtml = '<label class="foto" for="fotoIn" id="fotoBox">📷 <span>Agregar foto (opcional)</span></label><input id="fotoIn" type="file" accept="image/*" style="display:none" onchange="foto(this)">';

/* ---------- Reportar avance ---------- */
function abrirReporte(id){
  const t = TAREAS.find(x=>x.id===id), p = S.prog[id], resta = t.cant - hechasDe(t);
  S.rep = {id, sel:[], n: Math.min(1, resta)}; S.notaChip = null; S.foto = null;
  const cuerpo = t.codigos
    ? '<div class="muted">Toca cada '+esc(t.unidad)+' que terminaste</div><div class="elems">'+t.codigos.map(c=>{ const ya = p.listas.includes(c)||p.aprobadas.includes(c);
        return '<button class="elem '+(ya?'lista ya':'')+'" data-c="'+c+'" onclick="tocarElem(this)"><span class="check">✓</span>'+IC[t.tipo]+'<span class="cod">'+esc(c)+'</span></button>'; }).join('')+'</div>'
    : '<div class="muted">¿Cuántas '+esc(pl(2,t.unidad))+' terminaste? Quedan '+resta+'.</div>'+
      '<div class="contador"><button onclick="contar(-1)" aria-label="Menos">−</button><div class="valor"><span class="num" id="cuenta">'+S.rep.n+'</span><small>de '+resta+'</small></div><button onclick="contar(1)" aria-label="Más">+</button></div>';
  abrirHoja('<h3>'+esc(t.trabajo)+'</h3><div class="muted" style="margin-bottom:6px;">'+esc(t.donde)+'</div>'+cuerpo+
    chipsHtml(OPC[t.trabajo]||OPC.problema)+fotoHtml+
    '<button class="btn prim" id="enviar" '+(t.codigos?'disabled':'')+' onclick="enviarReporte()">'+(t.codigos? 'Enviar al jefe' : 'Enviar al jefe · '+S.rep.n+' '+pl(S.rep.n,t.unidad))+'</button>', 'hojaReporte');
}
function tocarElem(b){ const t = TAREAS.find(x=>x.id===S.rep.id), c = b.dataset.c; b.classList.toggle('lista'); S.rep.sel = b.classList.contains('lista')? S.rep.sel.concat(c) : S.rep.sel.filter(x=>x!==c); const e = $('#enviar'); e.disabled = !S.rep.sel.length; e.textContent = S.rep.sel.length? 'Enviar al jefe · '+S.rep.sel.length+' '+pl(S.rep.sel.length, t.unidad) : 'Enviar al jefe'; }
function contar(d){ const t = TAREAS.find(x=>x.id===S.rep.id), resta = t.cant - hechasDe(t); S.rep.n = Math.min(Math.max(S.rep.n+d, 1), resta); $('#cuenta').textContent = S.rep.n; $('#enviar').textContent = 'Enviar al jefe · '+S.rep.n+' '+pl(S.rep.n,t.unidad); }
function enviarReporte(){
  const t = TAREAS.find(x=>x.id===S.rep.id), p = S.prog[t.id];
  const n = t.codigos? S.rep.sel.length : S.rep.n; if(!n) return;
  const lote = t.codigos? S.rep.sel.slice() : null;
  if(t.codigos) p.listas = p.listas.concat(lote); else p.nPend += n;
  const nota = notaElegida();
  S.envios.unshift({ico:'✅', tipo:'avance', txt: esc(t.trabajo)+': '+n+' '+pl(n,t.unidad)+(lote? ' ('+lote.join(', ')+')':'')+(nota? ' · '+esc(nota):''), hora:fmtH(new Date()), estado:'pend', foto:!!S.foto, tarea:t.id});
  alJefe('📈','<b>Andrés Guamán</b> · '+esc(t.trabajo)+': reportó '+n+' de '+t.cant+' '+pl(t.cant,t.unidad)+(nota? ' · “'+esc(nota)+'”':'')+(S.foto? ' · 📷':''), {tipo:'aprobar', tarea:t.id, lote, n});
  cerrarHoja(); toast('Enviado al jefe ✓'); setTimeout(app, 120);
}

/* ---------- Anotar ---------- */
function vistaAnotar(){
  return '<section class="bloque"><h2>¿Qué quieres avisar?</h2>'+
    '<div class="par"><button class="btn sec" onclick="abrirNota(\'bitacora\')"><span>📝</span>Anotar algo</button><button class="btn sec" style="border-color:var(--mal); color:var(--mal);" onclick="abrirNota(\'problema\')"><span>⚠️</span>Un problema</button></div></section>'+
    '<section class="bloque"><h2>Lo que enviaste hoy <span class="extra">'+S.envios.length+'</span></h2>'+
      (S.envios.length? S.envios.map(e=>'<div class="envio"><span class="ico">'+e.ico+'</span><div style="flex:1;">'+e.txt+(e.foto?' 📷':'')+'<div class="meta">'+e.hora+' · '+(e.estado==='ok'?'<span style="color:var(--ok); font-weight:700;">'+(e.tipo==='avance'? 'aprobado por el jefe ✓' : (e.tipo==='desvio'? 'aceptado por el jefe ✓' : 'visto por el jefe ✓'))+'</span>' : (e.estado==='no'? '<span style="color:var(--mal); font-weight:700;">el jefe indicó que no aplica</span>' : 'enviado, el jefe lo revisa'))+'</div></div></div>').join('')
        : '<div class="muted">Todavía no has enviado nada hoy. Lo que reportes aparece aquí y le llega a tu jefe.</div>')+'</section>';
}
function abrirNota(tipo){
  S.tipoNota = tipo; S.notaChip = null; S.foto = null;
  abrirHoja('<h3>'+(tipo==='problema'? '⚠️ Reportar un problema' : '📝 Anotar en la bitácora')+'</h3><div class="muted">Elige una opción o escribe con tus palabras</div>'+
    chipsHtml(OPC[tipo])+'<textarea id="notaTxt" placeholder="'+(tipo==='problema'? 'Ej. Faltan 6 marcos en el piso 3' : 'Ej. Llegaron los marcos a las 10:15')+'"></textarea>'+fotoHtml+
    '<button class="btn prim" onclick="enviarNota()">Enviar al jefe</button>', 'hojaNota');
}
function enviarNota(){
  const extra = ($('#notaTxt').value||'').trim(), base = notaElegida();
  const txt = [base, extra].filter(Boolean).join(' · ');
  if(!txt){ toast('Elige una opción o escribe algo'); $('#notaTxt').focus(); return; }
  const prob = S.tipoNota==='problema';
  S.envios.unshift({ico: prob?'⚠️':'📝', tipo:'nota', txt:esc(txt), hora:fmtH(new Date()), estado:'pend', foto:!!S.foto});
  alJefe(prob?'⚠️':'📝', '<b>Andrés Guamán</b> '+(prob? 'reportó un problema' : 'anotó en la bitácora')+': “'+esc(txt)+'”'+(S.foto?' · 📷':''), {tipo:'visto'});
  cerrarHoja(); toast('Enviado al jefe ✓'); setTimeout(app, 120);
}

/* ---------- Mi semana ---------- */
function vistaSemana(){
  const dias = ['Lun','Mar','Mié','Jue','Vie','Sáb'], horas = [8.5,9,7.8,9.2,0,0];
  const hoyIdx = Math.min(Math.max(new Date().getDay()-1,0),5);
  horas[hoyIdx] = S.entrada? Math.round(((S.salida||new Date())-S.entrada)/3600e3*10)/10 : 0;
  const total = horas.reduce((s,h)=>s+h,0), max = Math.max(...horas, 9);
  const aprob = TAREAS.reduce((s,t)=> s + (t.codigos? S.prog[t.id].aprobadas.length : S.prog[t.id].nOk), 0);
  return '<section class="bloque"><h2>📅 Mis horas de la semana <span class="extra">'+String(Math.round(total*10)/10).replace('.',',')+' h</span></h2>'+
    '<div class="semana">'+dias.map((d,i)=>'<div class="d"><span style="font-weight:700; color:var(--tinta);">'+(horas[i]? String(horas[i]).replace('.',','):'')+'</span><div class="col '+(i===hoyIdx?'hoy':'')+'" style="height:'+Math.max(horas[i]/max*100,4)+'px"></div>'+d+'</div>').join('')+'</div>'+
    '<div class="cifras"><div><span class="num">'+(17+aprob)+'</span><small>aprobadas esta semana</small></div><div><span class="num">4</span><small>días trabajados</small></div><div><span class="num">'+S.envios.length+'</span><small>reportes hoy</small></div></div></section>'+
    '<section class="bloque"><h2>👤 Mi cuenta</h2><div class="muted">'+esc(S.usuario.nombre)+' · '+esc(S.usuario.grupo)+'<br>Jefe: '+esc(S.usuario.jefe)+'</div><button class="btn sec" onclick="location.reload()">Reiniciar demo</button></section>';
}


/* ---------- Me sacaron de esta tarea (desvío) ---------- */
function grupoChips(id, lista, conOtra){
  return '<div class="chips" data-g="'+id+'">'+lista.map(c=>'<button class="chip" onclick="elegir(this,\''+id+'\')">'+esc(c)+'</button>').join('')+
    (conOtra? '<button class="chip" onclick="elegir(this,\''+id+'\', true)">✏️ Otra…</button>' : '')+'</div>'+
    (conOtra? '<div class="otro" id="otro_'+id+'"><input class="txt" id="otroTxt_'+id+'" placeholder="Escribe qué tuviste que hacer"></div>' : '');
}
function elegir(b, id, otra){
  document.querySelectorAll('.chips[data-g="'+id+'"] .chip').forEach(c=>c.classList.remove('on')); b.classList.add('on');
  S.desv[id] = otra? '__otra' : b.textContent;
  const box = document.getElementById('otro_'+id); if(box){ box.classList.toggle('ver', !!otra); if(otra) setTimeout(()=>document.getElementById('otroTxt_'+id).focus(), 50); }
  const ok = valorDesv('que') && S.desv.tiempo; const e = $('#enviarDesv'); if(e) e.disabled = !ok;
}
function valorDesv(id){ const v = S.desv[id]; if(v==='__otra'){ const t = document.getElementById('otroTxt_'+id); return t? t.value.trim() : ''; } return v||''; }
function abrirDesvio(id){
  const t = TAREAS.find(x=>x.id===id); S.desv = {tarea:id};
  abrirHoja('<h3>⏸ Me sacaron de esta tarea</h3><div class="muted">Mientras hacías <b style="color:var(--tinta);">'+esc(t.trabajo)+'</b>. Le llega a tu jefe para que lo tome en cuenta.</div>'+
    '<div style="font-weight:700; margin-top:14px;">¿Qué tuviste que hacer?</div>'+grupoChips('que', ['Descargar material','Ayudar a otro grupo','Pedido del cliente','Corregir trabajo anterior','Esperar material'], true)+
    '<div style="font-weight:700; margin-top:6px;">¿Quién lo pidió?</div>'+grupoChips('quien', ['El jefe','El residente','El cliente','Nadie (espera)'], false)+
    '<div style="font-weight:700; margin-top:6px;">¿Cuánto tiempo te quitó?</div>'+grupoChips('tiempo', ['15 min','30 min','1 h','2 h','Medio día'], false)+
    '<button class="btn prim" id="enviarDesv" disabled onclick="enviarDesvio()">Enviar al jefe</button>', 'hojaDesvio');
  setTimeout(()=>{ const i = document.getElementById('otroTxt_que'); if(i) i.addEventListener('input', ()=>{ const e = $('#enviarDesv'); if(e) e.disabled = !(valorDesv('que') && S.desv.tiempo); }); }, 60);
}
function enviarDesvio(){
  const t = TAREAS.find(x=>x.id===S.desv.tarea), p = S.prog[t.id];
  const d = {que: valorDesv('que'), quien: S.desv.quien||'', tiempo: S.desv.tiempo, estado:'pend'};
  if(!d.que || !d.tiempo){ toast('Elige qué hiciste y cuánto tiempo'); return; }
  p.desvios.push(d);
  S.envios.unshift({ico:'⏸', tipo:'desvio', txt: esc(d.tiempo)+' en otra tarea: '+esc(d.que)+' (durante '+esc(t.trabajo)+')', hora:fmtH(new Date()), estado:'pend'});
  alJefe('⏸', '<b>Andrés Guamán</b>: '+esc(d.tiempo)+' en otra tarea — '+esc(d.que)+(d.quien? ', lo pidió '+esc(d.quien).toLowerCase():'')+' · durante <b>'+esc(t.trabajo)+'</b>', {tipo:'desvio', tarea:t.id, idx:p.desvios.length-1});
  cerrarHoja(); toast('Enviado al jefe ✓'); setTimeout(app, 120);
}
function decidirDesvio(k, acepta){
  const e = S.feed[k]; if(!e || e.hecho) return;
  const d = S.prog[e.accion.tarea].desvios[e.accion.idx]; d.estado = acepta? 'ok' : 'no';
  e.hecho = acepta? '✓ Aceptado · ese tiempo no cuenta en contra del grupo' : 'Marcado como no aplica';
  const env = S.envios.find(x=>x.tipo==='desvio' && x.estado==='pend'); if(env) env.estado = acepta? 'ok' : 'no';
  pintarJefe(); app();
}

/* ---------- Vista del jefe (simulada) ---------- */
function abrirJefe(){ S.sinLeer = 0; pintarOjo(); abrirHoja('<div id="jefeBox"></div>', 'hojaJefe'); pintarJefe(); }
function pintarJefe(){
  const box = $('#jefeBox'); if(!box) return;
  box.innerHTML = '<h3>👁 Así le llega a tu jefe</h3><div class="muted">Esto lo vería Isaac en su app, al instante. En el demo puedes aprobar como si fueras él.</div>'+
    '<div class="feed">'+(S.feed.length? S.feed.map((e,k)=>'<div class="ev"><span style="font-size:20px;">'+e.ico+'</span><div style="flex:1;">'+e.txt+'<div style="font-size:13px; color:var(--suave);">'+e.hora+'</div>'+
      (e.accion && e.accion.tipo==='aprobar' && !e.hecho? '<button class="mini" onclick="aprobar('+k+')">✓ Aprobar y descontar de la meta</button>' : '')+
      (e.accion && e.accion.tipo==='visto' && !e.hecho? '<button class="mini" style="background:var(--hoja-2); color:var(--tinta);" onclick="visto('+k+')">Marcar como visto</button>' : '')+
      (e.accion && e.accion.tipo==='desvio' && !e.hecho? '<div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="mini" onclick="decidirDesvio('+k+', true)">✓ Aceptar: no cuenta en contra</button><button class="mini" style="background:var(--hoja-2); color:var(--tinta);" onclick="decidirDesvio('+k+', false)">No aplica</button></div>' : '')+
      (e.hecho? '<div style="color:var(--ok); font-weight:700; font-size:14px; margin-top:4px;">'+e.hecho+'</div>':'')+'</div></div>').join('') : '<div class="muted" style="padding:10px 0;">Todavía no hay movimientos.</div>')+'</div>';
}
function aprobar(k){
  const e = S.feed[k]; if(!e || e.hecho) return;
  const t = TAREAS.find(x=>x.id===e.accion.tarea), p = S.prog[t.id];
  if(e.accion.lote){ e.accion.lote.forEach(c=>{ p.listas = p.listas.filter(x=>x!==c); if(!p.aprobadas.includes(c)) p.aprobadas.push(c); }); }
  else { p.nPend -= e.accion.n; p.nOk += e.accion.n; }
  e.hecho = '✓ Aprobado'+(t.trabajo==='Instalar puerta'? ' · se descontaron '+e.accion.n+' de la meta' : '');
  const env = S.envios.find(x=>x.tipo==='avance' && x.tarea===t.id && x.estado==='pend'); if(env) env.estado = 'ok';
  pintarJefe(); app(); toast('Isaac aprobó tu reporte ✓');
}
function visto(k){ const e = S.feed[k]; if(!e) return; e.hecho = '✓ Visto por el jefe'; const pend = S.envios.find(x=>x.tipo==='nota' && x.estado==='pend'); if(pend) pend.estado = 'ok'; pintarJefe(); app(); }

ingreso();
</script>
